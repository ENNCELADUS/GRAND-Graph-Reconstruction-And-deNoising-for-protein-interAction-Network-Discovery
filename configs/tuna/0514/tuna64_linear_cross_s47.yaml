run_config:
  stages:
  - train
  - evaluate
  seed: 47
  train_run_id: tuna64_linear_cross_s47
  topology_finetune_run_id: null
  adapt_run_id: null
  eval_run_id: tuna64_linear_cross_s47
  topology_eval_run_id: null
  load_checkpoint_path: null
  save_best_only: true
device_config:
  device: cuda
  ddp_enabled: true
  use_mixed_precision: true
data_config:
  benchmark:
    name: PRING
    root_dir: data/PRING
    species: human
    split_strategy: BFS
    processed_dir: data/PRING/human/BFS
  embeddings:
    source: esm3
    cache_dir: data/embeddings/esm3_1024
  max_sequence_length: 1024
  dataloader:
    train_dataset: data/PRING/human/BFS/human_train_ppi.txt
    valid_dataset: data/PRING/human/BFS/human_val_ppi.txt
    test_dataset: data/PRING/human/BFS/human_test_ppi.txt
    num_workers: 4
    pin_memory: true
    drop_last: true
    sampling:
      strategy: ohem
      warmup_epochs: 5
      pool_multiplier: 4
      cap_protein: 4
model_config:
  model: tuna
  input_dim: 1536
  hid_dim: 64
  n_layers: 1
  n_heads: 8
  ff_dim: 256
  dropout: 0.2
  max_sequence_length: 512
  activation_function: swish
  exclude_special_tokens: true
  inter_mask_mode: cross_chain
  random_seed: 47
  output_head:
    type: linear
training_config:
  epochs: 50
  batch_size: 32
  early_stopping_patience: 10
  monitor_metric: auprc
  logging:
    validation_metrics:
    - auprc
    - auroc
    - f1
    - accuracy
  optimizer:
    type: adamw
    lr: 0.0001
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-08
    weight_decay: 0.05
  scheduler:
    type: onecycle
    max_lr: 0.0001
    pct_start: 0.1
    div_factor: 25
    final_div_factor: 10000
    anneal_strategy: cos
  loss:
    type: bce_with_logits
    pos_weight: 1.0
    label_smoothing: 0.05
  strategy:
    type: none
  domain_adaptation:
    enabled: false
evaluate:
  decision_threshold:
    mode: fixed
    value: 0.5
  metrics:
  - auroc
  - auprc
  - accuracy
  - sensitivity
  - specificity
  - precision
  - recall
  - f1
  - mcc

run_config:
  stages:
  - tccig_train
  - evaluate
  - topology_evaluate
  seed: 47
  tccig_train_run_id: gpr_r0_esm_cosine_human_bfs_20260602a
  eval_run_id: gpr_r0_esm_cosine_human_bfs_20260602a
  topology_eval_run_id: gpr_r0_esm_cosine_human_bfs_20260602a
  load_checkpoint_path: null
  save_best_only: true
device_config:
  device: cuda
  ddp_enabled: true
  use_mixed_precision: true
data_config:
  benchmark:
    name: PRING
    root_dir: data/PRING
    species: human
    split_strategy: BFS
    processed_dir: data/PRING/species_processed_data/human/BFS
  embeddings:
    source: esm3
    cache_dir: data/embeddings/esm3_1024
  max_sequence_length: 1024
  dataloader:
    train_dataset: data/PRING/species_processed_data/human/BFS/human_train_ppi.txt
    valid_dataset: data/PRING/species_processed_data/human/BFS/human_val_ppi.txt
    test_dataset: data/PRING/species_processed_data/human/BFS/human_test_ppi.txt
    num_workers: 4
    pin_memory: true
    drop_last: true
    sampling:
      strategy: none
model_config:
  model: tccig
  input_dim: 1536
  d_model: 512
  dropout: 0.1
  lowrank_dim: 128
  num_modules: 64
  decoder_structural_gate_init: 0.0
  decoder_mode: retrieval_only
  self_refinement_rounds: 0
  retrieval:
    dim: 1536
    top_k: 256
    rff_features: 1536
    rff_input_dim: 1536
    rff_backend: dense
    rff_sigma: 1.0
    feature_source: pooled_input
    normalize: true
    logit_gate_init: 1.0
  candidate_proposer:
    type: all_pairs
  pair_mlp:
    hidden_dims:
    - 512
    - 256
training_config:
  epochs: 50
  batch_size: 32
  early_stopping_patience: 10
  monitor_metric: auprc
  logging:
    validation_metrics:
    - auprc
    - auroc
    - f1
    - accuracy
  optimizer:
    type: adamw
    lr: 0.0001
    weight_decay: 0.05
  scheduler:
    type: none
  loss:
    type: bce_with_logits
    pos_weight: 1.0
    label_smoothing: 0.05
  strategy:
    type: none
  domain_adaptation:
    enabled: false
tccig_train:
  epochs: 0
  supervision_train_dataset: data/PRING/species_processed_data/human/BFS/human_train_ppi_ratio5_exclusive.txt
  supervision_valid_dataset: data/PRING/species_processed_data/human/BFS/human_val_ppi_ratio5_exclusive.txt
  bce_negative_ratio: 5
  subgraph_node_range:
  - 60
  - 80
  gradient_accumulation_steps: 8
  strategy: mixed
  internal_validation_inference_batch_size: 1024
  internal_validation_node_sizes:
  - 20
  - 40
  - 60
  - 80
  - 100
  internal_validation_samples_per_size: 10
  compute_clustering_mmd: true
  internal_validation_compute_clustering_mmd: true
  monitor_metric: val_composite_score
  early_stopping_patience: 4
  optimizer:
    lr: 6.0e-06
    weight_decay: 0.006
  loss_weight_schedule:
    warmup_epochs: 0
    ramp_epochs: 0
    schedule: linear
  teacher:
    enabled: false
    hidden_dim: 128
    num_layers: 2
    decoder_hidden_dim: 128
    dropout: 0.1
    mask_ratio: 0.7
    negative_ratio: 1
    optimizer:
      lr: 0.001
      weight_decay: 0.0
  retrieval:
    backend: exact
    top_k: 256
    train_top_k: 128
    temperature: 0.07
    weight: 1.0
  graph_prior_teacher:
    enabled: false
    epochs: 5
    hidden_dim: 256
    num_layers: 2
    decoder_hidden_dim: 256
    dropout: 0.1
    mask_ratio: 0.7
    negative_ratio: 1
    artifact_dir: graph_prior_teacher
    reuse_artifacts: true
    struct_weight: 0.0
    degree_weight: 0.0
  hard_negative_mining:
    enabled: false
    top_k: 128
    max_pairs_per_epoch: 100000
    refresh_every_epochs: 1
    weight: 0.0
  reranker:
    enabled: false
    weight: 0.0
    adaptive_negative_temperature: 4.0
    external_teacher_enabled: false
  graph_assembly:
    rule: validation_density
    validation_density_budget: true
    degree_cap_enabled: false
    degree_cap_slack: 1.0
  validation_reconstruction:
    enabled: true
    full_universe: true
    node_batch_size: 64
    max_pairs: null
    recall_k_percent:
    - 1
    - 3
    - 5
    - 10
    - 20
  monitor:
    metric: val_composite_score
    recall_weight: 0.45
    auprc_weight: 0.25
    graph_sim_weight: 0.2
    relative_density_penalty: 0.05
    degree_mmd_penalty: 0.03
    clustering_mmd_penalty: 0.02
  losses:
    edge: 1.0
    teacher: 0.0
    budget: 0.1
    density: 0.1
    degree: 0.05
    clustering: 0.02
    calibration: 0.0
    sparse: 0.0
evaluate:
  mode: graph_assembly
  metrics:
  - auroc
  - auprc
  - accuracy
  - sensitivity
  - specificity
  - precision
  - recall
  - f1
  - mcc
topology_evaluate:
  inference_batch_size: 128
  tccig:
    candidate_batch_size: 8192
  save_pair_predictions: true
  report_baselines: src/topology/baselines/pring_human_table2.json
